<app-country-search (newSearch)="searchValue.set($event)" placeholder="Search by capital" />

<app-country-list
  [tableCaption]="'Countries by capital'"
  [countries]="countryResource.hasValue() ? countryResource.value() : []"
  [isLoading]="countryResource.isLoading()"
  [errorMessage]="countryResource.error()?.cause ?? undefined"
/>
