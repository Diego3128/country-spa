<div class="flex flex-wrap gap-2 justify-center">
  @for (regionItem of regionList; track regionItem) {
    <app-region-item
      [regionName]="regionItem"
      [isDisabled]="selectedRegion() === regionItem"
      (regionSelected)="selectedRegion.set($event)"
    />
  }
</div>

<app-country-list
  [countries]="regionResource.value() ?? []"
  [errorMessage]="regionResource.error()?.cause ?? undefined"
  [isLoading]="regionResource.isLoading()"
  [tableCaption]="`Countries by region ${selectedRegion() ?? ''}`"
/>
