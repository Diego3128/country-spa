<!-- country list -->
<section class="py-5 px-2">
  <div class="overflow-x-auto">
    <table class="table table-zebra max-w-5xl mx-auto">
      <caption>
        Countries
      </caption>
      <thead>
        <tr>
          <th>#</th>
          <th>Icon</th>
          <th>Flag</th>
          <th>Name</th>
          <th>Capital</th>
          <th>Population</th>
        </tr>
      </thead>
      <tbody>
        @for (country of countries(); track country.name.common) {
        <tr>
          <td>{{ country.flag }}</td>
          <td>
            <img [src]="country.flags.svg" [alt]="`${country.name.common} fla icon`" class="w-10" />
          </td>
          <td>{{ country.cca2 }}</td>
          <td>{{ country.name.common }}</td>
          <td>{{ country.capital[0] }}</td>
          <td>{{ country.population | number }}</td>
        </tr>
        }
      </tbody>
      <!-- <tfoot>
      <tr>
        <td>Total</td>
      </tr>
    </tfoot> -->
    </table>
  </div>
</section>
