<div class="min-h-[40vh] flex flex-col items-center justify-center gap-8 p-6 text-center">
  <!-- Icon / Illustration area -->
  <div
    class="w-20 h-20 rounded-full bg-base-200 flex items-center justify-center text-base-content/70 shadow-md"
  >
    <svg
      xmlns="http://www.w3.org/2000/svg"
      class="w-12 h-12"
      viewBox="0 0 24 24"
      fill="none"
      stroke="currentColor"
      stroke-width="1.8"
      stroke-linecap="round"
      stroke-linejoin="round"
    >
      <path d="M3 3h18v18H3z" />
      <path d="m9.4 14.27 2.6-2.6 2.6 2.6" />
      <path d="m14.6 9.47-2.6 2.6-2.6-2.6" />
    </svg>
  </div>

  <!-- Message -->
  <div class="max-w-md space-y-3">
    <h2 class="text-2xl font-bold tracking-tight">
      {{ message() ? 'Something went wrong' : 'No message' }}
    </h2>

    <p class="text-base-content/70 leading-relaxed">
      {{ message() || 'An unexpected situation occurred. Please try again or go back.' }}
    </p>
  </div>

  <!-- Action button -->
  <button
    (click)="goBack()"
    class="btn btn-primary btn-lg gap-2 shadow-md hover:shadow-lg transition-all"
  >
    <svg
      xmlns="http://www.w3.org/2000/svg"
      class="h-5 w-5"
      viewBox="0 0 24 24"
      fill="none"
      stroke="currentColor"
      stroke-width="2"
      stroke-linecap="round"
      stroke-linejoin="round"
    >
      <path d="M19 12H5M12 19l-7-7 7-7" />
    </svg>
    Go back
  </button>
</div>
